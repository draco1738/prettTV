name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests, Android lint and release build (debug-signed, no secrets needed)
        working-directory: launcher
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:assembleStability :app:assembleStabilityAndroidTest :testapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pretttv-debug-signed-ci-build
          path: launcher/app/build/outputs/apk/release/app-release.apk
      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretttv-validation-reports
          path: |
            launcher/app/build/reports/tests/testReleaseUnitTest/
            launcher/app/build/reports/lint-results-release.*
            launcher/app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
