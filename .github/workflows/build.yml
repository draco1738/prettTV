name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests and release build (debug-signed, no secrets needed)
        working-directory: launcher
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease :testapp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rivi-unsigned-ci-build
          path: launcher/app/build/outputs/apk/release/app-release.apk
